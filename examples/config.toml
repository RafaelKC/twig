# twig config example: a .NET back end + an Angular front end + a shared UI library.
# Format documented in docs/CONFIG.md.
#
# Copy it and adjust:
#   mkdir -p ~/.config/twig && cp examples/config.toml ~/.config/twig/config.toml
#   twig config edit && twig doctor

version = 1

[agent]
provider = "claude"               # "claude" | "codex"
# command      = "claude"         # default: the provider's
# context_file = "CLAUDE.md"      # default: CLAUDE.md (claude) / AGENTS.md (codex)

[provider]
default = "az"                    # "az" (Azure DevOps) | "gh" (GitHub)

[provider.az]
organization = "https://dev.azure.com/my-org"   # empty = az's default
project      = ""
item_url     = ""

[vscode]
enabled     = true
open_on_new = false

[herdr]
open_on_new = false

[open]
default = "herdr"                 # "herdr" | "code": target of `twig open` without one

[update]
check                = true       # hint on stderr when a new release exists (TTY only)
check_interval_hours = 24         # how often the latest release is looked up (cached)

[paths]
worktrees = "~/.wt"
repos     = "~/dev"                 # where the main clones live
search    = ["~/src"]               # other places to look for a repo

[git]
base_branch   = "main"
branch_prefix = { Bug = "fix", default = "feat" }
sync          = "rebase"            # "rebase" | "merge": what `twig sync` does with the base branch

[worktree]
# copied into every repo of the card
local_files = [
  ".claude/settings.local.json",   # Claude Code permissions, not versioned
]

# Lifecycle hooks: your own shell commands (see docs/CONFIG.md). Env: TWIG_CARD_ID, TWIG_CARD_DIR,
# TWIG_REPO, TWIG_REPO_DIR, TWIG_BRANCH, TWIG_EVENT. A failing pre_* aborts; post_* only warns.
# `--no-hooks` skips them all.
# [hooks]
# post_create  = ["echo created $TWIG_CARD_ID"]
# pre_rm       = ["./scripts/check-clean.sh"]
# post_rm      = []
# post_open    = []
# post_refresh = []

# Per-card ports: a repo with `port` gets port + offset in each card, the offset coming from the
# card number (1 + (n - 1) % span; card 52644 → +44). Panes get TWIG_PORT_<REPO> and PORT.
# [ports]
# span = 100

[repos.api]
label   = "⚙️ API"
short   = "api"
default = true
run     = "dotnet watch run --project src/Api --urls http://localhost:${PORT:-5000}"
port    = 5000                    # each card gets its own: 5000 + offset (see [ports])
ports   = { https = 5100 }        # more ports by name: TWIG_PORT_API_HTTPS (bases ≥ ports.span apart)
# extra environment of this repo's processes in a card, expanded per card ($VAR, ${VAR:-default})
env     = { Cors__Origins__0 = "http://localhost:${TWIG_PORT_WEB:-4200}" }
install = "dotnet restore"
debug   = [
  "Debug: Api",
  # "Debug: Worker",
]
local_files = [
  "src/*/appsettings.Development.json",
  "src/*/Properties/launchSettings.json",
]

[repos.web]
label       = "🌐 Web"
short       = "web"
default     = true
run         = "pnpm start -- --port ${PORT:-4200}"
port        = 4200
install     = "pnpm install"
debug       = ["Debug: web (starts the server)"]
local_files = ["src/environments/environment*.ts", ".env.local"]

[repos.ui-kit]
label   = "🎨 UI kit"
short   = "ui"
run     = "pnpm storybook"
autorun = false                   # VS Code task only, not started in herdr's run tab
install = "pnpm install"
