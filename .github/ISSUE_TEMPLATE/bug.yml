name: Bug report
description: Something in twig is broken or behaves unexpectedly
title: "[Bug]: "
labels: [bug]
assignees: [RafaelKC]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. twig new 123
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include error messages or logs if any.
      render: shell
  - type: input
    id: version
    attributes:
      label: twig version
      description: Output of `twig --version`
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS / WSL, provider (az/gh), agent, herdr version
  - type: textarea
    id: notes
    attributes:
      label: Additional context
