name: release-tag

# Manual release, step 2 of 2: when the "release vX.Y.Z" PR from release-prepare.yml is merged,
# push the tag vX.Y.Z on that commit. The tag push starts release.yml, which builds, signs and
# publishes. The tag is pushed with a PAT: a tag pushed with github.token would not start release.yml.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    # Only a release commit merged by the maintainer (auto-merge counts as whoever turned it on).
    if: >-
      startsWith(github.event.head_commit.message, 'release v')
      && github.actor == 'RafaelKC'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.AGENT_PAT }}
          fetch-depth: 0
      - name: tag and push
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # "release vX.Y.Z", possibly suffixed with "(#NN)" by a squash merge
          subject=$(printf '%s\n' "$MESSAGE" | head -n 1)
          tag=$(printf '%s\n' "$subject" | sed -n -E 's/^release (v[0-9]+\.[0-9]+\.[0-9]+)( \(#[0-9]+\))?$/\1/p')
          [ -n "$tag" ] || { echo "not a release commit: $subject"; exit 0; }
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          [ "v$version" = "$tag" ] || { echo "::error::Cargo.toml is $version, not ${tag#v}"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "::error::tag $tag already exists"; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "twig $tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
          echo "pushed $tag: release.yml publishes it" >>"$GITHUB_STEP_SUMMARY"
