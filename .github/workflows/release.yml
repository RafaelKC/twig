name: release

# Push a tag like v0.2.0 (scripts/release.sh --tag does it) to build, sign and publish a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: tag matches Cargo.toml version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != Cargo.toml v$version"; exit 1; }
      - run: cargo test --locked

  build:
    needs: test
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-14 }
          - { target: aarch64-apple-darwin, os: macos-14 }
          - { target: x86_64-pc-windows-msvc, os: windows-2025 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update -qq && sudo apt-get install -y musl-tools
      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: package
        if: ${{ !contains(matrix.target, 'windows') }}
        run: |
          pkg=twig-${{ matrix.target }}
          mkdir -p "$pkg/skills" "$pkg/herdr-plugins"
          cp target/${{ matrix.target }}/release/twig "$pkg/"
          cp -R skills/twig "$pkg/skills/"
          cp -R herdr-plugins/twig "$pkg/herdr-plugins/"
          cp LICENSE README.md "$pkg/"
          tar -czf "$pkg.tar.gz" "$pkg"
      - name: package (Windows)
        if: ${{ contains(matrix.target, 'windows') }}
        shell: pwsh
        run: |
          $pkg = "twig-${{ matrix.target }}"
          New-Item -ItemType Directory -Force "$pkg/skills", "$pkg/herdr-plugins" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/twig.exe" "$pkg/"
          Copy-Item -Recurse skills/twig "$pkg/skills/"
          Copy-Item -Recurse herdr-plugins/twig "$pkg/herdr-plugins/"
          Copy-Item LICENSE, README.md "$pkg/"
          Compress-Archive -Path $pkg -DestinationPath "$pkg.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: twig-${{ matrix.target }}
          path: twig-${{ matrix.target }}.*
          if-no-files-found: error

  # Release notes written by Claude. Best effort: whatever goes wrong here, the release still goes
  # out with the notes GitHub generates. The PR/issue text is untrusted, so this job has a read-only
  # token and claude runs with no tools (scripts/release/notes.sh). It runs on the agent's self-hosted
  # runner to reuse its Claude login (subscription, no API key); only the maintainer can push a v* tag.
  notes:
    needs: test
    runs-on: [self-hosted, linux, ARM64, twig-agent]
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the previous tag and the history between them
      - name: write release notes with Claude
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          unset ANTHROPIC_API_KEY # the subscription login must be used, never a metered key
          command -v claude >/dev/null || { echo "::warning::claude is not installed on the runner; using GitHub's generated notes"; exit 0; }
          rm -rf notes; mkdir -p notes
          prev=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^")
          scripts/release/notes.sh "$prev" "$GITHUB_REF_NAME" > notes/body.md
          [ -s notes/body.md ] || rm -f notes/body.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: notes/body.md
          if-no-files-found: ignore

  release:
    needs: [build, notes]
    if: ${{ !cancelled() && needs.build.result == 'success' }} # a failed notes job must not block the release
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the release
      id-token: write # Sigstore keyless signing (GitHub OIDC)
      attestations: write # build provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: twig-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: release-notes
          path: notes
      - name: checksums
        working-directory: dist
        run: |
          cp ../install.sh ../install.ps1 .
          sha256sum *.tar.gz *.zip install.sh install.ps1 > SHA256SUMS
          cat SHA256SUMS
      - uses: sigstore/cosign-installer@v3
      - name: sign checksums (Sigstore keyless)
        working-directory: dist
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
      - name: build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/install.sh
            dist/install.ps1
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          # Claude's notes (if any) come first; GitHub appends its generated PR list and Full Changelog
          body_path: ${{ hashFiles('notes/body.md') != '' && 'notes/body.md' || '' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
