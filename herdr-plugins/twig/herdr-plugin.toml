id = "twig"
name = "twig"
version = "0.3.0"
min_herdr_version = "0.9.0"
description = "Shortcuts for twig card workspaces (~/.wt/<id>)"
platforms = ["linux", "macos", "windows"]

[[actions]]
id = "open-code"
title = "Open card in VS Code"
contexts = ["workspace"]
platforms = ["linux", "macos"]
command = ["sh", "open-code.sh"]

# Windows (herdr's native Windows support is in beta): same action, through PowerShell.
# The installer binds prefix+shift+o to this one on Windows.
[[actions]]
id = "open-code-windows"
title = "Open card in VS Code"
contexts = ["workspace"]
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "open-code.ps1"]
