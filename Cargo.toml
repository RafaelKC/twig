[package]
name = "twig"
version = "0.7.0"
edition = "2021"
description = "One isolated workspace per task card: git worktrees across repos, an AI agent per repo in herdr, and a VS Code workspace"
license = "MIT"
publish = false

[[bin]]
name = "twig"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# the env-based (dynamic) completions are behind an unstable feature: pinned on purpose
clap_complete = { version = "=4.6.11", features = ["unstable-dynamic"] }
dirs = "5"
glob = "0.3"
indexmap = { version = "2", features = ["serde"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
toml_edit = "0.22"
unicode-normalization = "0.1"

[target.'cfg(any(unix, windows))'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
tempfile = "3"
